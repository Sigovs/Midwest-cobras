<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>model check</title>
<style>
  html,body{margin:0;background:#1a1d21;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"../assets/js/vendor/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../assets/js/vendor/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from '../assets/js/vendor/jsm/environments/RoomEnvironment.js';

const W = 1280, H = 800;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d21);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd0e0, 0.6);
fill.position.set(-6, 3, -4);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x15181b, roughness: 0.55, metalness: 0.0 })
);
scene.add(floor);

const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);

const VIEWS = {
  'front-quarter': [4.4, 1.35, 4.6],
  'side':          [7.4, 1.15, 0.2],
  'rear-quarter':  [-4.2, 1.5, -4.4],
  'high-front':    [3.2, 3.4, 4.2],
  'true-side':     [0.2, 1.05, 7.2],
  'front-3q':      [-4.6, 1.3, 4.2],
  'low-front':     [-4.8, 0.62, 3.0],
};

const loader = new GLTFLoader();
loader.load('../assets/model/cobra.glb', (g) => {
  scene.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene);
  const size = box.getSize(new THREE.Vector3());
  const ctr = box.getCenter(new THREE.Vector3());
  window.__bbox = { size: size.toArray(), center: ctr.toArray() };

  window.__shoot = (name) => {
    const p = VIEWS[name];
    camera.position.set(p[0], p[1], p[2]);
    camera.lookAt(0, size.y * 0.42, 0);
    renderer.render(scene, camera);
  };
  window.__THREE = THREE;
  window.__scene = scene;
  window.__model = g.scene;

  window.__clay = (recompute) => {
    const m = new THREE.MeshStandardMaterial({
      color: 0x9a9a9a, roughness: 0.42, metalness: 0.0, side: THREE.DoubleSide,
    });
    g.scene.traverse((o) => {
      if (!o.isMesh) return;
      if (recompute) { o.geometry.deleteAttribute('normal'); o.geometry.computeVertexNormals(); }
      o.material = m;
    });
  };

  window.__paint = () => {
    // one body colour, glass and chrome separated by material name — the
    // cheapest test of whether the model's grouping is usable at all
    g.scene.traverse((o) => {
      if (!o.isMesh) return;
      const n = (o.material && o.material.name || '').toLowerCase();
      if (n.includes('glass')) {
        o.material = new THREE.MeshPhysicalMaterial({ color: 0xdfe6ea, roughness: 0.05, metalness: 0, transmission: 0.9, thickness: 0.01, side: THREE.DoubleSide });
      } else if (n.includes('cromado') || n.includes('steel') || n.includes('chrome') || n.includes('magnesium') || n.includes('iron')) {
        o.material = new THREE.MeshStandardMaterial({ color: 0xd8dade, roughness: 0.18, metalness: 1.0, side: THREE.DoubleSide });
      } else if (n === 'cobra' || n.includes('faichas') || n.includes('emblema')) {
        o.material = new THREE.MeshPhysicalMaterial({ color: 0x1c3f6e, roughness: 0.22, metalness: 0.55, clearcoat: 1, clearcoatRoughness: 0.06, side: THREE.DoubleSide });
      } else if (n.includes('cuero') || n.includes('bancos') || n.includes('costura') || n.includes('carpete')) {
        o.material = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.72, metalness: 0, side: THREE.DoubleSide });
      } else {
        o.material = new THREE.MeshStandardMaterial({ color: 0x23262a, roughness: 0.55, metalness: 0.1, side: THREE.DoubleSide });
      }
    });
  };

  window.__ready = true;
}, undefined, (e) => { window.__error = String(e); window.__ready = true; });
</script>
</body>
</html>
